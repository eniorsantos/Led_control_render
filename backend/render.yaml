services:
  - type: web
    name: saas-leds-api
    env: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 3001
      - key: SEED
        value: "false"
      - key: HOJE
        value: ""
      - key: DATABASE_URL
        description: "Connection string do Supabase/PostgreSQL (obrigatório em produção). Obtém em Settings > Database > Connection string > URI."
        required: true
    healthCheckPath: /api/health