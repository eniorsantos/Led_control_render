# Render Blueprint — SaaS Controle de Veiculação LED
# Deploy: Backend (Web Service) + Frontend (Static Site)
#
# Como usar:
# 1. Push para GitHub (este arquivo deve ficar na RAIZ do repositório)
# 2. Render Dashboard → New + → Blueprint → conecte o repo
# 3. Na primeira sincronização, o Render pedirá o valor de DATABASE_URL (sync: false)
# 4. Confirme que a URL pública do backend bate com VITE_API_URL / FRONTEND_URL abaixo

services:
  # ─── BACKEND: Node/Express API ───
  - type: web
    name: saas-leds-api
    runtime: node            # "env" é legado; o campo atual é "runtime"
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: npm ci     # reprodutível (exige package-lock.json); use npm install se não houver lockfile
    startCommand: npm start
    healthCheckPath: /api/health
    buildFilter:             # em monorepo, só redeploya se o backend mudar
      paths:
        - backend/**
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: SEED
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      # URL do frontend, para configurar CORS no backend (ajuste o nome da variável ao seu código)
      - key: FRONTEND_URL
        value: https://saas-leds-frontend.onrender.com
      # Segredo: o Render pergunta o valor na primeira sincronização.
      # Supabase > Settings > Database > Connection string > URI
      # (prefira a string do pooler, ver observações)
      - key: DATABASE_URL
        sync: false
      # PORT removida: o Render injeta PORT (padrão 10000). O app deve usar process.env.PORT.

  # ─── FRONTEND: Static Site (Vite + React) ───
  - type: web
    name: saas-leds-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    previews:
      generation: automatic  # substitui o legado pullRequestPreviewsEnabled
    buildFilter:
      paths:
        - frontend/**
    envVars:
      # fromService/host devolve só o hostname INTERNO (rede privada), inacessível pelo
      # navegador, e "transform" não existe no spec. Use a URL pública do backend.
      # SEM /api no final - o código do frontend já faz API + path (ex: /api/auth/login)
      - key: VITE_API_URL
        value: https://saas-leds-api.onrender.com
    routes:
      # SPA fallback
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: "public, max-age=31536000, immutable"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
